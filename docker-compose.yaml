name: tabero

x-tabero-common: &tabero-common
  image: ${TABERO_IMAGE:-ccr.ccs.tencentyun.com/vtla/vtla:0.4}
  network_mode: host
  ipc: host
  shm_size: "16gb"
  # PyTorch CUDA tensor sharing uses pidfd_getfd between RLinf's sibling
  # environment processes. Docker's default seccomp profile blocks that
  # syscall, and SYS_PTRACE is required by the kernel access check.
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
  ulimits:
    memlock: -1
    stack: 67108864
  environment:
    ACCEPT_EULA: "Y"
    OMNI_KIT_ALLOW_ROOT: "1"
    NVIDIA_DRIVER_CAPABILITIES: all
    ISAACSIM_PATH: /root/VTLA-RL/isaacsim
    ISAACLAB_PATH: /root/VTLA-RL/IsaacLab
  volumes:
    - type: bind
      source: ${TABERO_DATASETS_HOST:-${TABERO_HOST:-.}/datasets}
      target: /root/VTLA-RL/datasets
      read_only: true
    - type: bind
      source: ${TABERO_MODELS_HOST:-${TABERO_HOST:-.}/models}
      target: /root/VTLA-RL/models
      read_only: true
    - type: bind
      source: ${TABERO_RESULTS_HOST:-${TABERO_HOST:-.}/results}
      target: /root/VTLA-RL/results
    - type: bind
      source: ${TABERO_RECORD_HOST:-${TABERO_HOST:-.}/Record}
      target: /root/VTLA-RL/Record
    - type: bind
      source: ${TABERO_ENV_FILE:-.env}
      target: /root/VTLA-RL/.env
      read_only: true
    - type: volume
      source: isaac-kit-cache
      target: /isaac-sim/kit/cache
    - type: volume
      source: isaac-ov-cache
      target: /root/.cache/ov
    - type: volume
      source: isaac-gl-cache
      target: /root/.cache/nvidia/GLCache
    - type: volume
      source: isaac-compute-cache
      target: /root/.nv/ComputeCache
    - type: volume
      source: isaac-logs
      target: /root/.nvidia-omniverse/logs
    - type: volume
      source: isaac-ov-data
      target: /root/.local/share/ov/data

services:
  shell:
    <<: *tabero-common
    build:
      context: .
      dockerfile: Dockerfile
      # Use the host network for optional local proxy access during dependency
      # installation. Runtime containers keep the network_mode above.
      network: host
      args:
        ISAACSIM_IMAGE: ${ISAACSIM_IMAGE:-nvcr.io/nvidia/isaac-sim:5.1.0}
        UV_VERSION: ${UV_VERSION:-0.12.9}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-https://mirror.sjtu.edu.cn/pytorch-wheels/cu128}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
        HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
        ALL_PROXY: ${ALL_PROXY:-${all_proxy:-}}
      secrets:
        - hf_token
    gpus: all
    stdin_open: true
    tty: true
    command: ["shell"]

  t2-vla:
    <<: *tabero-common
    gpus: all
    stdin_open: true
    tty: true
    command: ["t2-vla"]

  rlinf:
    <<: *tabero-common
    gpus: all
    stdin_open: true
    tty: true
    command: ["rlinf"]

  tabero_x:
    <<: *tabero-common
    gpus: all
    stdin_open: true
    tty: true
    command: ["tabero_x"]

volumes:
  isaac-kit-cache:
  isaac-ov-cache:
  isaac-gl-cache:
  isaac-compute-cache:
  isaac-logs:
  isaac-ov-data:

secrets:
  hf_token:
    environment: HF_TOKEN
